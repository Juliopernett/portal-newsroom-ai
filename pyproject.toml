[project]
name = "portal-newsroom-ai"
version = "0.3.0"
description = "Plataforma interna de Portal Vallenato para asistir al equipo editorial con IA."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Portal Vallenato" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection requires `Depends(...)` as an argument
# default — the documented pattern, not the mutable-default-argument bug
# B008 exists to catch. See https://fastapi.tiangolo.com/tutorial/dependencies/
"app/api/routers/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "core",
    "agents",
    "workflows",
    "database",
    "config",
    "shared",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = [
    "app",
    "core",
    "agents",
    "workflows",
    "database",
    "config",
    "shared",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    # `Protocol` method bodies (`core/ports/`) are never executed directly —
    # only concrete adapters that implement them run.
    "^\\s*\\.\\.\\.$",
    "^\\s*raise NotImplementedError",
    "if TYPE_CHECKING:",
]
