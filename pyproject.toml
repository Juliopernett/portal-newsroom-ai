[project]
name = "portal-newsroom-ai"
version = "0.2.0"
description = "Plataforma interna de Portal Vallenato para asistir al equipo editorial con IA."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Portal Vallenato" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "core",
    "agents",
    "workflows",
    "database",
    "config",
    "shared",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = [
    "app",
    "core",
    "agents",
    "workflows",
    "database",
    "config",
    "shared",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
