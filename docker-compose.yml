services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./database:/app/database
    restart: unless-stopped

  # No hay un servicio "db" local: DATABASE_URL en .env ya decide SQLite
  # (default) o PostgreSQL (Sprint 3C, ver database/engine.py) sin cambiar
  # código. En producción, Postgres vive en Railway, no en este compose.
